{{ define "main" }}
<div class="masonry-wrapper">
    <div class="masonry-grid">
        {{ range .Pages }}
            <!-- Find the first JPG image in the bundle -->
            {{ $image := .Resources.GetMatch "*.jpg" }}
            <!-- Or try jpeg, png if needed: .Resources.GetMatch "*{.jpg,.jpeg,.png}" -->
            
            {{ if $image }}
                <!-- Link wrapper to make the whole card clickable -->
                <a href="{{ .RelPermalink }}" class="grid-item">
                    <!-- 
                        Hugo Image Processing:
                        You can resize images here for thumbnails if original is too huge:
                        {{ $thumb := $image.Resize "600x" }}
                        But using original for now as requested.
                    -->
                    <img 
                        src="{{ $image.RelPermalink }}" 
                        width="{{ $image.Width }}" 
                        height="{{ $image.Height }}" 
                        alt="{{ .Title }}" 
                        loading="lazy">
                    
                    <div class="grid-caption">
                        <h3>{{ .Title }}</h3>
                        <p>{{ .Date.Format "Jan 2, 2006" }}</p>
                    </div>
                </a>
            {{ end }}
        {{ end }}
    </div>
</div>
{{ end }}
