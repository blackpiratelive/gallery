{{ define "main" }}
<div class="masonry-wrapper">
    <div class="masonry-grid">
        {{ range .Pages }}
            <!-- Find the first JPG image in the bundle -->
            {{ $image := .Resources.GetMatch "*.jpg" }}
            
            {{ if $image }}
                <!-- 
                   Create Thumbnail:
                   1. Resize to 600px width (maintains aspect ratio)
                   2. Convert to WebP
                   3. Set Quality to 50%
                -->
                {{ $thumb := $image.Resize "600x webp q50" }}

                <!-- Link wrapper points to the single page -->
                <a href="{{ .RelPermalink }}" class="grid-item">
                    <img 
                        src="{{ $thumb.RelPermalink }}" 
                        width="{{ $thumb.Width }}" 
                        height="{{ $thumb.Height }}" 
                        alt="{{ .Title }}" 
                        loading="lazy">
                    
                    <div class="grid-caption">
                        <h3>{{ .Title }}</h3>
                        <p>{{ .Date.Format "Jan 2, 2006" }}</p>
                    </div>
                </a>
            {{ end }}
        {{ end }}
    </div>
</div>
{{ end }}
